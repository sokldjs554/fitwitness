# One grouped pull request per ecosystem and week instead of one per package. Major versions stay separate (a major bump
# can change behaviour and needs its own look); minor and patch updates are batched. The measured numbers in
# docs/evaluation/ do not move with a dependency bump, but the committed uv.lock does, so every group goes through CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    # the Node image only builds the web bundle; a new major of it is not worth a PR of its own each week
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
