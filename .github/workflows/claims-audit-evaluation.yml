name: claims-audit-evaluation
# A model reads every decision that is about to pay and looks for a reason not to; measured on the weakened control
# (how many wrong payments it stops) and on the sound run (how often it stops a right one). Manual only.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: anthropic (Claude Haiku 4.5, pricing fixed below) or openai (model and pricing from repository variables)
        default: 'anthropic'
        required: true
        type: choice
        options: [anthropic, openai]
      mode:
        description: degraded = the weakened rules that let wrong payments through; clean = the sound rules; subtle = a grade and a date read off by one and the deductible not taken off, which no computed fact names
        default: 'degraded'
        required: true
        type: choice
        options: [degraded, clean, subtle]
      split:
        description: which claims (all = 120)
        default: 'all'
        required: true
        type: choice
        options: [all, test, dev]
      max_cases:
        description: at most this many claims of the split (blank = all)
        default: ''
        required: false
      max_usd:
        description: hard ceiling for the whole batch in USD (at most 1.0)
        default: '0.5'
        required: true
      per_call_usd:
        description: budget of one audit call, reserved before it starts (at most 0.1)
        default: '0.03'
        required: true
permissions:
  contents: read
concurrency:
  group: claims-audit-evaluation
  cancel-in-progress: false
jobs:
  measure:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      FITWITNESS_ANTHROPIC_INPUT_USD_PER_MILLION: '1'
      FITWITNESS_ANTHROPIC_OUTPUT_USD_PER_MILLION: '5'
      FITWITNESS_OPENAI_MODEL: ${{ vars.FITWITNESS_OPENAI_MODEL }}
      FITWITNESS_OPENAI_INPUT_USD_PER_MILLION: ${{ vars.FITWITNESS_OPENAI_INPUT_USD_PER_MILLION }}
      FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION: ${{ vars.FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION }}
      PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v7
      - name: Require a privately configured credential, a model with a price, and a sane ceiling
        env:
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_PER_CALL_USD: ${{ inputs.per_call_usd }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          provider = os.environ['PROVIDER']
          need = ['ANTHROPIC_API_KEY'] if provider == 'anthropic' else ['OPENAI_API_KEY', 'FITWITNESS_OPENAI_MODEL', 'FITWITNESS_OPENAI_INPUT_USD_PER_MILLION', 'FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION']
          missing = [k for k in need if not os.getenv(k)]
          if missing:
              raise SystemExit(f'missing for provider {provider}: {", ".join(missing)}. Nothing was called.')
          ceiling, cap = float(os.environ['INPUT_MAX_USD']), float(os.environ['INPUT_PER_CALL_USD'])
          assert 0 < ceiling <= 1.0, ceiling
          assert 0 < cap <= 0.1, cap
          print('configuration present for', provider, '(values not printed)')
          PY
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --no-dev
      - run: uv run python -c "from pathlib import Path; from fitwitness.claims.synth import generate_cases; generate_cases(Path('var/claims'), n=120)"
      - name: Audit every decision about to pay
        env:
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PER_CALL_USD: ${{ inputs.per_call_usd }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_SPLIT: ${{ inputs.split }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_CASES: ${{ inputs.max_cases }}
        run: >-
          uv run python -m fitwitness.evaluation.claims_audit
          --provider "$INPUT_PROVIDER" --mode "$INPUT_MODE" --split "$INPUT_SPLIT"
          ${MAX_CASES:+--max-cases "$MAX_CASES"}
          --max-cost-usd "$INPUT_MAX_USD" --per-call-usd "$INPUT_PER_CALL_USD"
          --output artifacts/claims-audit
      - name: Summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          f = Path('artifacts/claims-audit/report.json')
          if not f.exists():
              print('no report'); raise SystemExit(0)
          r = json.loads(f.read_text())
          print('== protocol', json.dumps(r['protocol'], ensure_ascii=False))
          print('== summary', json.dumps(r['summary'], ensure_ascii=False))
          print('== skipped', json.dumps(r['skipped']), 'stopped', r['stopped'])
          for row in r['rows']:
              print('== row', json.dumps({k: row.get(k) for k in ('case_id', 'scenario', 'gold', 'decision', 'should_flag', 'flagged', 'caught', 'false_flag', 'missed', 'verdict', 'error', 'cost_usd', 'latency_ms', 'input_tokens', 'output_tokens', 'repairs')}, ensure_ascii=False, default=str)[:4000])
          for row in r['rows']:
              for e in row.get('model_errors', []):
                  print('== model_error', row['case_id'], json.dumps({k: e.get(k) for k in ('role', 'attempt', 'repair', 'error_type', 'status_code', 'stop_reason', 'parse_error', 'raw_output')}, ensure_ascii=False, default=str)[:6000])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: claims-audit-${{ inputs.provider }}-${{ inputs.mode }}-${{ inputs.split }}-${{ github.run_id }}
          path: artifacts/claims-audit/
          if-no-files-found: warn
