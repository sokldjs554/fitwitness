name: image-channel-evaluation
# OpenCLIP against DINOv2 on the retrieval-v2 queries: alone and inside the hybrid. Pinned encoders, real
# PostgreSQL, no LLM calls. Manual only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-channel-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --extra dev --extra models
      - run: uv run python scripts/setup.py
      - run: uv run pytest tests/unit/test_indexing.py tests/unit/test_retrieval_metrics.py tests/integration/test_dense_index.py -q
      - run: uv run python scripts/download_encoders.py
      - run: uv run python -m fitwitness.evaluation.retrieval --image --output artifacts/image-channel
      - name: Summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          f = Path('artifacts/image-channel/report.json')
          if not f.exists():
              print('no report'); raise SystemExit(0)
          r = json.loads(f.read_text())
          print('== protocol', json.dumps({k: r['protocol'][k] for k in ('version', 'methods', 'repeats', 'recall_k', 'ndcg_k')}))
          print('== models', json.dumps({k: {'model_id': v['model_id'], 'revision': v['revision']} for k, v in r['models'].items()}))
          print('== code', r['code_sha'], 'raw_sha256', r['raw_sha256'], 'corpus', r['corpus_size'], 'index_ms', round(r['index_ms']), 'load_ms', round(r['model_load_ms']))
          for m in r['methods']:
              print('== method', m['id'], json.dumps({'overall': m['metrics'], 'categories': {c: {k: v[k] for k in ('recall_at_5', 'ndcg_at_10', 'attempts')} for c, v in m['categories'].items()}}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-channel-${{ github.run_id }}
          path: artifacts/image-channel/
          if-no-files-found: warn
