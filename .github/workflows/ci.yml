name: verified-demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
# A push to a pull-request branch also triggers the pull_request run: one run per ref, the older one cancelled.
# Never on main: every commit of main must end with a finished run, because deploy.yml only ships a commit that has a green one.
concurrency:
  group: verified-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        round: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
      FITWITNESS_SESSION_LIMIT_PER_PEER: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.4"  # the version Dockerfile and render.yaml pin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 tesseract-ocr tesseract-ocr-kor
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/setup.py
      - name: "Lint (pyflakes rules: unused or undefined names)"
        run: uvx ruff@0.15.20 check --select F src scripts
      - run: uv run python scripts/verify-research.py
      - run: uv run pytest -q --junitxml=artifacts/pytest.xml
      - name: Evaluation gate (no API, real PostgreSQL) against committed baseline
        run: uv run python -m fitwitness.evaluation.gate --output artifacts/gate --baseline docs/evaluation/gate-baseline.json --require-optional
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          .venv/bin/uvicorn fitwitness.api.app:create_app --factory --host 0.0.0.0 --port 8787 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/ready && exit 0; sleep 1; done
          echo "the API did not become ready"; tail -30 /tmp/api.log; exit 1
      - run: npm run test:e2e -- --workers=2
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
      - run: node scripts/capture-demo.mjs
        env:
          FITWITNESS_DEMO_URL: http://127.0.0.1:8787
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-round-${{ matrix.round }}
          path: |
            artifacts/
            web/test-results/
  prometheus-rules:
    # The alert and recording rules in deploy/prometheus, checked and unit-tested with a pinned promtool.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: promtool from Prometheus 3.5.0 (sha256 pinned)
        run: |
          curl -sSfL -o /tmp/prometheus.tgz https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz
          echo "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a  /tmp/prometheus.tgz" | sha256sum -c -
          tar -xzf /tmp/prometheus.tgz -C /tmp
      - name: Check the rules, run their unit tests, check the config and the dashboard JSON
        run: |
          P=/tmp/prometheus-3.5.0.linux-amd64/promtool
          $P check rules deploy/prometheus/rules/*.yml
          $P test rules deploy/prometheus/tests/*.test.yml
          # the config as the container reads it, with its paths pointed at the checkout
          printf ci > /tmp/metrics-token
          sed -e "s|/etc/prometheus/rules/|$PWD/deploy/prometheus/rules/|; s|/etc/prometheus/metrics-token|/tmp/metrics-token|" deploy/prometheus/prometheus.yml > /tmp/prometheus.yml
          $P check config /tmp/prometheus.yml
          python3 -c "import json; json.load(open('deploy/grafana/dashboards/fitwitness.json'))"
      - name: Alertmanager 0.28.1 (sha256 pinned) - the config, and that every alert reaches its severity's receiver
        run: |
          curl -sSfL -o /tmp/alertmanager.tgz https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz
          echo "5ac7ab5e4b8ee5ce4d8fb0988f9cb275efcc3f181b4b408179fafee121693311  /tmp/alertmanager.tgz" | sha256sum -c -
          tar -xzf /tmp/alertmanager.tgz -C /tmp
          A=/tmp/alertmanager-0.28.1.linux-amd64/amtool
          $A check-config deploy/alertmanager/alertmanager.yml
          python3 scripts/check_alert_routes.py $A deploy/alertmanager/alertmanager.yml deploy/prometheus/rules/fitwitness-alerts.yml
