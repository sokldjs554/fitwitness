name: verified-demo
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        round: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
      FITWITNESS_SESSION_LIMIT_PER_PEER: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/setup.py
      - run: uv run python scripts/verify-research.py
      - run: uv run pytest -q --junitxml=artifacts/pytest.xml
      - name: Evaluation gate (no API, real PostgreSQL) against committed baseline
        run: uv run python -m fitwitness.evaluation.gate --output artifacts/gate --baseline docs/evaluation/gate-baseline.json
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          .venv/bin/uvicorn fitwitness.api.app:create_app --factory --host 0.0.0.0 --port 8787 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/ready && break; sleep 1; done
      - run: npm run test:e2e -- --workers=2
        working-directory: web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8787
      - run: node scripts/capture-demo.mjs
        env:
          FITWITNESS_DEMO_URL: http://127.0.0.1:8787
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-round-${{ matrix.round }}
          path: |
            artifacts/
            web/test-results/
  credential-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/fitwitness-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Record credential presence only (no API calls)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          result={key:bool(os.getenv(key)) for key in ('OPENAI_API_KEY','ANTHROPIC_API_KEY')}
          Path('credential-readiness.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: credential-readiness
          path: credential-readiness.json
