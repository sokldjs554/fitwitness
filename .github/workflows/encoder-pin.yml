name: encoder-pin
# Print the hash-locked models.json entry for a Hugging Face model from a runner that can reach the hub.
# Manual only; nothing is verified or committed here. A person copies the printed entry into retrieval/models.json.
on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Hugging Face model id
        default: facebook/dinov2-small
        required: true
      revision:
        description: branch, tag or commit to resolve
        default: main
        required: true
      files:
        description: space separated files to lock
        default: config.json model.safetensors preprocessor_config.json
        required: true
      folder:
        description: folder name under the model cache
        default: dino
        required: true
      license:
        description: licence note for the entry
        default: Apache-2.0 (upstream weights; FitWitness code Apache-2.0)
        required: true
permissions:
  contents: read
jobs:
  pin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          INPUT_MODEL_ID: ${{ inputs.model_id }}
          INPUT_REVISION: ${{ inputs.revision }}
          INPUT_FILES: ${{ inputs.files }}
          INPUT_FOLDER: ${{ inputs.folder }}
          INPUT_LICENSE: ${{ inputs.license }}
        run: python3 scripts/pin_encoder.py "$INPUT_MODEL_ID" --revision "$INPUT_REVISION" --files $INPUT_FILES --folder "$INPUT_FOLDER" --license "$INPUT_LICENSE"
