name: retrieval-reranking-pilot
on:
  workflow_dispatch:
concurrency:
  group: reranking-evaluation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  evaluate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --extra dev --extra models
      - run: uv run python scripts/setup.py
      - run: uv run pytest tests/unit/test_indexing.py tests/unit/test_retrieval_metrics.py tests/unit/test_reranking.py tests/unit/test_retrieval_ablation.py tests/integration/test_dense_index.py -q
      - run: uv run python scripts/download_encoders.py --reranker
      - run: uv run python -m fitwitness.evaluation.retrieval --ablation --output artifacts/reranking-v1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reranking-v1
          path: artifacts/reranking-v1/
