name: tracked-source-archive
on:
  workflow_dispatch:
concurrency:
  group: source-archive
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  archive:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=fitwitness-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: tracked-source
          path: fitwitness-source.tar.gz
