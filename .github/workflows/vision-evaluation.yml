name: claude-vision-evaluation
on:
  push:
    branches: [feat/fitwitness-foundation]
permissions:
  contents: read
concurrency:
  group: claude-vision-evaluation
  cancel-in-progress: false
jobs:
  evaluate:
    # Prior total $0.187841 + this isolated maximum $0.55 < authorized $1.
    # One marker, first attempt only. Raw failures/reservations are preserved.
    if: >-
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, 'eval: vision pilot [remaining-usd=0.55]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
    steps:
      - uses: actions/checkout@v4
      - name: Require privately configured credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'ANTHROPIC_API_KEY repository secret is missing.'
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/setup.py
        env:
          PYTHONPATH: src
      - run: uv run pytest tests/unit/test_vision.py tests/unit/test_provider_retry.py tests/integration/test_dense_index.py -q
      - name: Run actual vision calls (18 caps of 0.025 USD + graph cap 0.10 USD)
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FITWITNESS_ANTHROPIC_INPUT_USD_PER_MILLION: '1'
          FITWITNESS_ANTHROPIC_OUTPUT_USD_PER_MILLION: '5'
        run: >-
          uv run python -m fitwitness.evaluation.vision
          --output artifacts/claude-vision-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-vision-${{ github.run_id }}
          path: artifacts/claude-vision-${{ github.run_id }}/
          if-no-files-found: warn
