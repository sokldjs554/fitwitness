name: claude-evidence-pilot
on:
  push:
    branches: [feat/fitwitness-foundation]
permissions:
  contents: read
concurrency:
  group: claude-evidence-pilot
  cancel-in-progress: false
jobs:
  evaluate:
    # A dedicated, explicitly authorized marker commit is required. Ordinary
    # pushes, pull requests and storing a secret do not make paid API calls.
    if: >-
      startsWith(github.event.head_commit.message, 'eval: claude evidence pilot [max-usd=1]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require privately configured credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo 'ANTHROPIC_API_KEY repository secret is missing.'
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --no-dev
      - run: uv run python -m fitwitness.data.generate
        env:
          PYTHONPATH: src
      - name: Verify identical evaluation inputs before paid calls
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from fitwitness.evaluation.dataset import build_cases
          from fitwitness.evaluation.runner import digest
          published = json.loads(Path('docs/evaluation/latest.json').read_text())
          assert digest(build_cases(Path('var/corpus'))) == published['protocol']['dataset_hash']
          PY
      - name: Run frozen PDF evidence pilot (maximum 1 USD reservation)
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FITWITNESS_ANTHROPIC_INPUT_USD_PER_MILLION: '1'
          FITWITNESS_ANTHROPIC_OUTPUT_USD_PER_MILLION: '5'
        run: >-
          uv run python -m fitwitness.evaluation.runner
          --provider anthropic --model claude-haiku-4-5-20251001
          --max-cost-usd 1 --repeats 3
          --output artifacts/claude-evidence-${{ github.run_id }}
      - name: Require complete measured calls (do not hide failures)
        env:
          REPORT_PATH: artifacts/claude-evidence-${{ github.run_id }}/report.json
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['REPORT_PATH']).read_text())
          method = next(m for m in report['methods'] if m['id'] == 'anthropic')
          assert method['metrics']['attempts'] == 72
          assert method['metrics']['completed'] == 72, method['metrics']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-evidence-${{ github.run_id }}
          path: artifacts/claude-evidence-${{ github.run_id }}/
          if-no-files-found: warn
