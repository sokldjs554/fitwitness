name: openai-evidence-measure
# The PDF evidence verdict pilot (docs/evaluation/README.md) with an OpenAI model: the same 24 cases the Claude and
# Qwen records were made from, so the three can be read side by side. Paid: it runs only by hand, with the ceiling the
# operator types in (the runner refuses the first call that could pass it) and never above 0.25 USD. The repository
# secret OPENAI_API_KEY must exist; the model id and its prices are inputs, not stored, so a price change is typed in
# with each run. The report is printed at the end so the numbers can be copied into docs/evaluation without the artifact.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model id (exact, e.g. the current small model)"
        required: true
      input_usd_per_million:
        description: "price of input tokens, USD per million (from the current price list)"
        required: true
      output_usd_per_million:
        description: "price of output tokens, USD per million"
        required: true
      max_cost_usd:
        description: "ceiling for the whole run, USD (at most 0.25)"
        required: true
        default: "0.10"
      repeats:
        description: "repeats per case (1-3); 3 matches the Claude record"
        required: true
        default: "3"
permissions:
  contents: read
concurrency:
  group: openai-evidence-measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
      - name: Preflight the credential, the inputs and the ceiling (no API call)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
          IN_PRICE: ${{ inputs.input_usd_per_million }}
          OUT_PRICE: ${{ inputs.output_usd_per_million }}
          MODEL: ${{ inputs.model }}
        run: |
          python3 - <<'PY'
          import os
          from decimal import Decimal
          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("OPENAI_API_KEY repository secret is missing; nothing was called")
          cap = Decimal(os.environ["MAX_COST_USD"])
          if not (Decimal("0") < cap <= Decimal("0.25")):
              raise SystemExit(f"max_cost_usd must be within (0, 0.25], got {cap}")
          for name in ("IN_PRICE", "OUT_PRICE"):
              if Decimal(os.environ[name]) <= 0:
                  raise SystemExit(f"{name} must be a positive price")
          if not os.environ["MODEL"].strip():
              raise SystemExit("model is required")
          print("configuration present; the key is not printed")
          PY
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --no-dev
      - run: uv run python scripts/setup.py
      - name: Verify identical evaluation inputs before paid calls
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from fitwitness.evaluation.dataset import build_cases
          from fitwitness.evaluation.runner import digest
          published = json.loads(Path('docs/evaluation/latest.json').read_text())
          assert digest(build_cases(Path('var/corpus'))) == published['protocol']['dataset_hash']
          PY
      - name: Run the evidence verdict pilot with the OpenAI model, under the ceiling
        env:
          INPUT_MAX_COST_USD: ${{ inputs.max_cost_usd }}
          INPUT_MODEL: ${{ inputs.model }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FITWITNESS_OPENAI_INPUT_USD_PER_MILLION: ${{ inputs.input_usd_per_million }}
          FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION: ${{ inputs.output_usd_per_million }}
        run: >-
          uv run python -m fitwitness.evaluation.runner
          --provider openai --model "$INPUT_MODEL"
          --max-cost-usd "$INPUT_MAX_COST_USD" --repeats "$INPUT_REPEATS"
          --output artifacts/openai-evidence-${{ github.run_id }}
      - name: Print the report (the numbers the docs cite)
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          f = Path('artifacts/openai-evidence-${{ github.run_id }}/report.json')
          if not f.exists():
              raise SystemExit('no report')
          r = json.loads(f.read_text())
          rows = [x for x in r['predictions'] if x.get('method') != 'rules']
          # The artifact cannot always be fetched from where this log is read, so the numbers are printed here, one line
          # per call, after the methods' own metrics. The cases (about 1,700 lines) stay in the artifact.
          print('== protocol', json.dumps({k: r['protocol'].get(k) for k in ('code_sha', 'dataset_hash', 'prompt_hash', 'repeats', 'case_count')}))
          print('== model', json.dumps(r['model'], ensure_ascii=False))
          print('== methods', json.dumps(r['methods'], ensure_ascii=False))
          print('== model_rows', json.dumps({'total': len(rows), 'ok': sum(1 for x in rows if x.get('status') == 'ok'), 'error': sum(1 for x in rows if x.get('status') != 'ok'), 'cost_usd': sum(float(x.get('cost_usd') or 0) for x in rows), 'first_error': next((x.get('error') for x in rows if x.get('error')), None)}))
          for x in rows:
              print('== row', json.dumps({k: x.get(k) for k in ('case_id', 'category', 'repeat', 'expected', 'predicted', 'status', 'error', 'citations', 'input_tokens', 'output_tokens', 'cost_usd', 'latency_ms')}, ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: openai-evidence-${{ github.run_id }}
          path: artifacts/openai-evidence-${{ github.run_id }}/
          if-no-files-found: warn
