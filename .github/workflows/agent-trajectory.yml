name: agent-trajectory
# The road a real model takes through the drawing graph on the test families, under a hard ceiling.
# Manual only. Nothing here runs on push.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: anthropic (Claude Haiku 4.5, pricing fixed below) or openai (model and pricing from the repository variables FITWITNESS_OPENAI_MODEL, FITWITNESS_OPENAI_INPUT_USD_PER_MILLION, FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION)
        default: 'anthropic'
        required: true
        type: choice
        options: [anthropic, openai]
      max_usd:
        description: hard ceiling for the whole run in USD (at most 1.0)
        default: '0.8'
        required: true
      per_run_usd:
        description: budget of one graph run, reserved before it starts (at most 0.1)
        default: '0.04'
        required: true
      modes:
        description: comma separated graph modes to run on every family
        default: 'fixed,react,fitwitness'
        required: true
      challenger_provider:
        description: a second model for the challenger's turn in mode fitwitness (empty = the planner's model plays both roles). Needs that provider's key, and for openai its model and price variables
        default: ''
        required: false
        type: choice
        options: ['', openai, anthropic]
      first_repeat:
        description: the repeat to start at (0 runs them all; 2 with repeats 3 runs only the third, for a run a ceiling had cut short)
        default: '0'
        required: true
      repeats:
        description: runs per mode and case (1 to 10); the repeats of one case are not independent observations
        default: '1'
        required: true
      workspace:
        description: family (the family's five drawings are indexed) or split (all thirty base drawings of the split, a same-kind family among them)
        default: 'family'
        required: true
        type: choice
        options: [family, split]
      materials:
        description: comma separated materials, one query per family and material (SUS304 is the base drawing's; AL6061 asks for the other one)
        default: 'SUS304'
        required: true
      families:
        description: space separated family ids to run (blank = all six of the test split), for a cheap first look
        default: ''
        required: false
      top_k:
        description: candidates the search returns (0 keeps the default, 6; the split workspace needs 12 to reach every drawing of a family)
        default: '0'
        required: true
      openai_model:
        description: openai only - the exact model id; blank uses the repository variable FITWITNESS_OPENAI_MODEL
        default: ''
        required: false
      openai_input_usd_per_million:
        description: openai only - price of input tokens, USD per million, from the current price list; blank uses the repository variable
        default: ''
        required: false
      openai_output_usd_per_million:
        description: openai only - price of output tokens, USD per million; blank uses the repository variable
        default: ''
        required: false
      openai_reasoning_effort:
        description: openai reasoning models only - minimal keeps the 1500-token limit, low and medium widen it to 6000 (reserved in full)
        default: 'minimal'
        required: true
        type: choice
        options: [minimal, low, medium]
permissions:
  contents: read
concurrency:
  group: agent-trajectory
  cancel-in-progress: false
jobs:
  measure:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      FITWITNESS_ANTHROPIC_INPUT_USD_PER_MILLION: '1'
      FITWITNESS_ANTHROPIC_OUTPUT_USD_PER_MILLION: '5'
      FITWITNESS_OPENAI_MODEL: ${{ inputs.openai_model || vars.FITWITNESS_OPENAI_MODEL }}
      FITWITNESS_OPENAI_INPUT_USD_PER_MILLION: ${{ inputs.openai_input_usd_per_million || vars.FITWITNESS_OPENAI_INPUT_USD_PER_MILLION }}
      FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION: ${{ inputs.openai_output_usd_per_million || vars.FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION }}
      FITWITNESS_OPENAI_REASONING_EFFORT: ${{ inputs.openai_reasoning_effort }}
      PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a privately configured credential, a model with a price, and a sane ceiling
        env:
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_PER_RUN_USD: ${{ inputs.per_run_usd }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          INPUT_FIRST_REPEAT: ${{ inputs.first_repeat }}
          INPUT_CHALLENGER_PROVIDER: ${{ inputs.challenger_provider }}
          INPUT_MATERIALS: ${{ inputs.materials }}
          INPUT_TOP_K: ${{ inputs.top_k }}
          INPUT_FAMILIES: ${{ inputs.families }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          provider = os.environ['PROVIDER']
          need = ['ANTHROPIC_API_KEY'] if provider == 'anthropic' else ['OPENAI_API_KEY', 'FITWITNESS_OPENAI_MODEL', 'FITWITNESS_OPENAI_INPUT_USD_PER_MILLION', 'FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION']
          missing = [k for k in need if not os.getenv(k)]
          if missing:
              raise SystemExit(f'missing for provider {provider}: {", ".join(missing)} (a repository secret for the key, repository variables for the model and its price). Nothing was called.')
          ceiling, cap = float(os.environ['INPUT_MAX_USD']), float(os.environ['INPUT_PER_RUN_USD'])
          assert 0 < ceiling <= 1.0, ceiling
          assert 0 < cap <= 0.1, cap
          assert re.fullmatch(r'(?:[1-9]|10)', os.environ['INPUT_REPEATS']), os.environ['INPUT_REPEATS']
          assert re.fullmatch(r'[0-9]', os.environ['INPUT_FIRST_REPEAT']) and int(os.environ['INPUT_FIRST_REPEAT']) < int(os.environ['INPUT_REPEATS'])
          second = os.environ.get('INPUT_CHALLENGER_PROVIDER', '')
          if second and second != provider:
              need2 = ['ANTHROPIC_API_KEY'] if second == 'anthropic' else ['OPENAI_API_KEY', 'FITWITNESS_OPENAI_MODEL', 'FITWITNESS_OPENAI_INPUT_USD_PER_MILLION', 'FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION']
              missing2 = [k for k in need2 if not os.getenv(k)]
              if missing2:
                  raise SystemExit(f'missing for the challenger provider {second}: {", ".join(missing2)}. Nothing was called.')
          assert re.fullmatch(r'[A-Za-z0-9]+(?:,[A-Za-z0-9]+)*', os.environ['INPUT_MATERIALS']), os.environ['INPUT_MATERIALS']
          assert re.fullmatch(r'[0-9]{1,2}', os.environ['INPUT_TOP_K']) and int(os.environ['INPUT_TOP_K']) <= 50
          assert re.fullmatch(r'(?:FW-F[0-9]{3}(?: FW-F[0-9]{3})*)?', os.environ['INPUT_FAMILIES']), os.environ['INPUT_FAMILIES']
          print('configuration present for', provider, '(values not printed)')
          PY
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --no-dev
      - run: uv run python scripts/setup.py
      - name: Rules reference, then the model on every test family and mode
        env:
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_MODES: ${{ inputs.modes }}
          INPUT_PER_RUN_USD: ${{ inputs.per_run_usd }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          INPUT_REPEATS: ${{ inputs.repeats }}
          INPUT_FIRST_REPEAT: ${{ inputs.first_repeat }}
          INPUT_CHALLENGER_PROVIDER: ${{ inputs.challenger_provider }}
          INPUT_WORKSPACE: ${{ inputs.workspace }}
          INPUT_MATERIALS: ${{ inputs.materials }}
          INPUT_TOP_K: ${{ inputs.top_k }}
          INPUT_FAMILIES: ${{ inputs.families }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run python -m fitwitness.evaluation.agent_trajectory
          --provider "$INPUT_PROVIDER"
          --modes "$INPUT_MODES"
          --max-cost-usd "$INPUT_MAX_USD" --per-run-usd "$INPUT_PER_RUN_USD"
          --repeats "$INPUT_REPEATS" --first-repeat "$INPUT_FIRST_REPEAT" ${INPUT_CHALLENGER_PROVIDER:+--challenger-provider "$INPUT_CHALLENGER_PROVIDER"} --workspace "$INPUT_WORKSPACE" --materials "$INPUT_MATERIALS" --top-k "$INPUT_TOP_K"
          ${INPUT_FAMILIES:+--families $INPUT_FAMILIES}
          --output artifacts/agent-trajectory
      - name: Summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          f = Path('artifacts/agent-trajectory/report.json')
          if not f.exists():
              print('no report'); raise SystemExit(0)
          r = json.loads(f.read_text())
          # The artifact cannot always be fetched from where the log is read, so everything is printed here, and the
          # totals last: the end of the log is what can be read when the log is long.
          for row in r['rows']:
              print('== row', json.dumps({k: row.get(k) for k in ('provider', 'mode', 'case_id', 'repeat', 'state', 'error', 'correct', 'total', 'retrieved', 'coverage_before_verdict', 'uninspected', 'roles', 'challenger_tools', 'tools', 'skipped_repeats', 'stop', 'violations', 'failures', 'tool_errors', 'repairs', 'model_calls', 'tool_calls', 'input_tokens', 'output_tokens', 'cost_usd', 'latency_ms')}, ensure_ascii=False, default=str))
          # A model's refused or malformed output: the parse error and the raw output are the only way to say why a run failed.
          for row in r['rows']:
              for e in row.get('model_errors', []):
                  print('== model_error', row['mode'], row['case_id'], json.dumps({k: e.get(k) for k in ('role', 'attempt', 'error_type', 'status_code', 'stop_reason', 'parse_error', 'raw_output')}, ensure_ascii=False, default=str)[:3000])
          print('== protocol', json.dumps({k: r['protocol'].get(k) for k in ('code_sha', 'provider', 'model', 'modes', 'repeats', 'workspace', 'workspace_drawings', 'top_k', 'materials', 'ceiling_usd', 'per_run_cap_usd', 'pricing_usd_per_million')}))
          for mode, m in r['summary']['by_mode'].items():
              print('== mode', mode, json.dumps(m, ensure_ascii=False))
          print('== spent', r['summary']['spent_usd'], 'skipped', len(r['skipped']), json.dumps(r['skipped'][:3]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-trajectory-${{ inputs.provider }}-${{ github.run_id }}
          path: artifacts/agent-trajectory/
          if-no-files-found: warn
