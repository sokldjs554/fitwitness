name: external-nist-sources
on:
  push:
    branches: [feat/fitwitness-foundation]
permissions:
  contents: read
jobs:
  sources:
    if: contains(github.event.head_commit.message, '[nist-sources]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download original public NIST test-case definitions
        run: |
          mkdir -p artifacts/nist
          python - <<'PY'
          import hashlib,json,urllib.request,zipfile,io
          from pathlib import Path
          out=Path('artifacts/nist'); entries=[]
          for kind in ('ctc','ftc'):
              url=f'https://www.nist.gov/document/nist-{kind}-test-case-definitions'
              with urllib.request.urlopen(url,timeout=120) as response:
                  body=response.read();resolved=response.url
              archive=zipfile.ZipFile(io.BytesIO(body))
              (out/f'{kind}.zip').write_bytes(body)
              entries.append(dict(name=kind,url=url,resolved_url=resolved,sha256=hashlib.sha256(body).hexdigest(),files=archive.namelist()))
          (out/'sources.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nist-original-sources
          path: artifacts/nist/
