name: external-nist-sources
on:
  push:
    branches: [feat/fitwitness-foundation]
permissions:
  contents: read
jobs:
  sources:
    if: contains(github.event.head_commit.message, '[nist-sources]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download original public NIST test-case definitions
        run: |
          mkdir -p artifacts/nist
          python - <<'PY'
          import hashlib,json,urllib.request,zipfile,io
          from pathlib import Path
          out=Path('artifacts/nist'); entries=[]
          url='https://raw.githubusercontent.com/usnistgov/SFA/72375d17c09cf7072c30d9393b5c08b7aa272285/Release/NIST-PMI-STEP-Files.zip'
          with urllib.request.urlopen(url,timeout=120) as response:
              body=response.read();resolved=response.url
          digest=hashlib.sha256(body).hexdigest()
          assert digest=='1fb91bb8ff0fe02032b948fda0775bc74591cd0bebc0988347d32574e5884f90'
          archive=zipfile.ZipFile(io.BytesIO(body))
          (out/'NIST-PMI-STEP-Files.zip').write_bytes(body)
          entries.append(dict(name='NIST-PMI-STEP-Files',url=url,resolved_url=resolved,sha256=digest,files=archive.namelist()))
          (out/'sources.json').write_text(json.dumps(entries,indent=2))
          print(json.dumps(entries,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nist-original-sources
          path: artifacts/nist/
