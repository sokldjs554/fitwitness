name: claims-injection-model
# Injected remarks in claim documents read by a real model, under a hard ceiling.
# Manual only. Nothing here runs on push.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: anthropic (Claude Haiku 4.5, pricing fixed below) or openai (model and pricing from the repository variables FITWITNESS_OPENAI_MODEL, FITWITNESS_OPENAI_INPUT_USD_PER_MILLION, FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION)
        default: 'anthropic'
        required: true
        type: choice
        options: [anthropic, openai]
      max_usd:
        description: hard ceiling for the whole batch in USD (at most 1.0)
        default: '0.3'
        required: true
      per_run_usd:
        description: budget of one claim run, reserved before it starts (at most 0.1)
        default: '0.04'
        required: true
      cases:
        description: space separated case ids (each is one clean run plus one run per remark kind)
        default: 'CLM-00000 CLM-00002'
        required: true
permissions:
  contents: read
concurrency:
  group: claims-injection-model
  cancel-in-progress: false
jobs:
  measure:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      FITWITNESS_ANTHROPIC_INPUT_USD_PER_MILLION: '1'
      FITWITNESS_ANTHROPIC_OUTPUT_USD_PER_MILLION: '5'
      FITWITNESS_OPENAI_MODEL: ${{ vars.FITWITNESS_OPENAI_MODEL }}
      FITWITNESS_OPENAI_INPUT_USD_PER_MILLION: ${{ vars.FITWITNESS_OPENAI_INPUT_USD_PER_MILLION }}
      FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION: ${{ vars.FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION }}
      PROVIDER: ${{ inputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a privately configured credential, a model with a price, and a sane ceiling
        env:
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_PER_RUN_USD: ${{ inputs.per_run_usd }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          provider = os.environ['PROVIDER']
          need = ['ANTHROPIC_API_KEY'] if provider == 'anthropic' else ['OPENAI_API_KEY', 'FITWITNESS_OPENAI_MODEL', 'FITWITNESS_OPENAI_INPUT_USD_PER_MILLION', 'FITWITNESS_OPENAI_OUTPUT_USD_PER_MILLION']
          missing = [k for k in need if not os.getenv(k)]
          if missing:
              raise SystemExit(f'missing for provider {provider}: {", ".join(missing)} (a repository secret for the key, repository variables for the model and its price). Nothing was called.')
          ceiling, cap = float(os.environ['INPUT_MAX_USD']), float(os.environ['INPUT_PER_RUN_USD'])
          assert 0 < ceiling <= 1.0, ceiling
          assert 0 < cap <= 0.1, cap
          print('configuration present for', provider, '(values not printed)')
          PY
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --no-dev
      - run: uv run python scripts/setup.py
      - name: Clean and injected prints of each case through the claim graph with the model
        env:
          INPUT_CASES: ${{ inputs.cases }}
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_PER_RUN_USD: ${{ inputs.per_run_usd }}
          INPUT_PROVIDER: ${{ inputs.provider }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          uv run python -m fitwitness.evaluation.claims_injection_model
          --provider "$INPUT_PROVIDER"
          --cases $INPUT_CASES
          --max-cost-usd "$INPUT_MAX_USD" --per-run-usd "$INPUT_PER_RUN_USD"
          --output artifacts/claims-injection-model
      - name: Summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          f = Path('artifacts/claims-injection-model/report.json')
          if not f.exists():
              print('no report'); raise SystemExit(0)
          r = json.loads(f.read_text())
          print('== protocol', json.dumps(r['protocol'], ensure_ascii=False))
          s = r['summary']
          print('== spent', s['spent_usd'], 'ceiling', s['ceiling_usd'], 'runs', s['runs'], 'completed', s['completed'], 'waiting_input', s['waiting_input'], 'failed', s['failed'], 'model_errors', s['model_errors'], 'repairs', s['repairs'], 'skipped', json.dumps(r['skipped']), 'stopped', r['stopped'])
          for path in ('model', 'rules'):
              print('== summary', path, json.dumps(s[path], ensure_ascii=False))
          for row in r['rows']:
              print('== pair', json.dumps({k: row.get(k) for k in ('path', 'case_id', 'scenario', 'kind', 'incomparable', 'clean', 'injected', 'fields_changed', 'values', 'decision_changed', 'sent_to_review', 'unsafe_change', 'wrong_pay', 'wrong_deny', 'clean_matches_gold', 'rules_added', 'confidence', 'model_clean_matches_rules_clean', 'grounded_fields', 'proposed_changed', 'proposed_values', 'dropped_by_grounding', 'run_id')}, ensure_ascii=False, default=str))
          for run in r['runs']:
              print('== run', json.dumps({k: run.get(k) for k in ('case_id', 'kind', 'state', 'error', 'extracted', 'proposed', 'dropped', 'grounded_fields', 'decision', 'model_calls', 'repairs', 'input_tokens', 'output_tokens', 'cost_usd', 'charged_usd', 'latency_ms', 'run_id')}, ensure_ascii=False, default=str))
          # The artifact cannot always be fetched from where the log is read, so a model's refused or malformed
          # output is printed here too: the parse error and the raw output are the only way to say why a run failed.
          for run in r['runs']:
              for e in run.get('model_errors', []):
                  print('== model_error', run['case_id'], run['kind'], json.dumps({k: e.get(k) for k in ('role', 'attempt', 'repair', 'error_type', 'status_code', 'stop_reason', 'parse_error', 'raw_output')}, ensure_ascii=False, default=str)[:6000])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: claims-injection-model-${{ inputs.provider }}-${{ github.run_id }}
          path: artifacts/claims-injection-model/
          if-no-files-found: warn
