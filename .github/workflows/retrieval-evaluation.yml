name: pretrained-retrieval-pilot
on:
  workflow_dispatch:
concurrency:
  group: retrieval-evaluation
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  evaluate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --extra dev --extra models
      - run: uv run python scripts/setup.py
      - run: uv run pytest tests/unit/test_indexing.py tests/unit/test_retrieval_metrics.py tests/integration/test_dense_index.py -q
      - run: uv run python scripts/download_encoders.py
      - run: uv run python -m fitwitness.evaluation.retrieval --output artifacts/retrieval-v2
      - name: Summary (printed here because the artifact cannot always be fetched from where the log is read)
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path
          f = Path('artifacts/retrieval-v2/runs.jsonl')
          if not f.exists():
              print('no runs'); raise SystemExit(0)
          cells = defaultdict(list)
          for line in f.read_text().splitlines():
              r = json.loads(line)
              cells[(r['method'], r['category'])].append(r.get('recall_at_5') or 0.0)
          for (method, category), v in sorted(cells.items()):
              print('== cell', method, category, round(sum(v) / len(v), 4), len(v))
          p = json.loads(Path('artifacts/retrieval-v2/protocol.json').read_text())
          print('== cases', len(p['cases']), sorted({c['category'] for c in p['cases']}))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retrieval-v2
          path: artifacts/retrieval-v2/
