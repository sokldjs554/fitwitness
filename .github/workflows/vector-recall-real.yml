name: vector-recall-real
# HNSW recall against the exact scan on vectors the pinned multilingual-E5 encoder wrote (the 2026-10-29 record used random
# vectors, the worst case for the index). Free: no model API is called; the encoder files come from the hash-locked download.
# scripts/hnsw-recall-real.py says what it measures and what it does not.
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: drawing counts, space separated (100000 takes the longest)
        default: '10000 100000'
        required: true
      queries:
        description: natural-language queries compared with the exact answer
        default: '50'
        required: true
permissions:
  contents: read
concurrency:
  group: vector-recall-real
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitwitness
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fitwitness
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U fitwitness"
          --health-interval 5s --health-timeout 5s --health-retries 10
          --shm-size 1g
    env:
      FITWITNESS_DATABASE_URL: postgresql://fitwitness:test-only@localhost:5432/fitwitness
      PYTHONPATH: src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      FITWITNESS_TORCH_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: uv sync --frozen --extra dev --extra models
      - run: uv run python scripts/download_encoders.py
      - name: Measure
        env:
          INPUT_SIZES: ${{ inputs.sizes }}
          INPUT_QUERIES: ${{ inputs.queries }}
        run: |
          case "$INPUT_SIZES" in *[!0-9\ ]*) echo "sizes: digits and spaces only"; exit 1;; esac
          case "$INPUT_QUERIES" in ''|*[!0-9]*) echo "queries: digits only"; exit 1;; esac
          uv run python scripts/hnsw-recall-real.py --sizes $INPUT_SIZES --queries "$INPUT_QUERIES" --output artifacts/hnsw-recall-real.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hnsw-recall-real-${{ github.run_id }}
          path: artifacts/hnsw-recall-real.json
          if-no-files-found: warn
