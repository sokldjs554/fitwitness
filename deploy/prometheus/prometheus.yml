# Prometheus for a local fitwitness (see docs/OBSERVABILITY.md, "알림 규칙과 SLO").
# The app serves /metrics only with the bearer token in FITWITNESS_METRICS_TOKEN; put the same value in the
# file mounted at /etc/prometheus/metrics-token.
global:
  scrape_interval: 30s
  evaluation_interval: 1m
rule_files:
  - /etc/prometheus/rules/*.yml
scrape_configs:
  - job_name: fitwitness
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ['host.docker.internal:8787']
