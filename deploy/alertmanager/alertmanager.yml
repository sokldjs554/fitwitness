# Alertmanager for the alert rules in deploy/prometheus (see docs/OBSERVABILITY.md, "알림을 받는 곳").
#
# Routing: severity=page wants someone now and repeats every hour until it resolves; everything else is a ticket and
# repeats twice a day. Both receivers below are webhooks to scripts/alert-sink.py on the host, which writes what it
# received to a file. That is the receiver this repository tests against, not a pager: to be told for real, replace a
# receiver with email_configs / slack_configs / pagerduty_configs and keep the credential in a file
# (smtp_auth_password_file, api_url_file), never in this file.
route:
  receiver: ticket
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: [severity="page"]
      receiver: page
      repeat_interval: 1h
receivers:
  - name: page
    webhook_configs:
      - url: http://host.docker.internal:9094/page
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url: http://host.docker.internal:9094/ticket
        send_resolved: true
