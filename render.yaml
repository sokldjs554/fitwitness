services:
  - type: web
    name: fitwitness
    runtime: python
    buildCommand: uv sync --frozen --no-dev && .venv/bin/python -m fitwitness.data.generate && .venv/bin/python -m fitwitness.claims.synth var/claims 120 && npm --prefix web ci && npm --prefix web run build
    startCommand: .venv/bin/python scripts/setup.py && exec .venv/bin/uvicorn fitwitness.api.app:create_app --factory --host 0.0.0.0 --port $PORT
    branch: main
    plan: free
    region: singapore
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: UV_VERSION
        value: 0.9.4
      - key: NODE_VERSION
        value: 22.14.0
      - key: PYTHONPATH
        value: src
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
      - key: FITWITNESS_DATABASE_URL
        sync: false
      - key: FITWITNESS_SESSION_SECRET
        generateValue: true
      - key: FITWITNESS_ALLOWED_ORIGINS
        value: https://fitwitness.onrender.com
      - key: FITWITNESS_METRICS_TOKEN
        generateValue: true
